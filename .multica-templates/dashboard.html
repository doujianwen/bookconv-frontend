<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multica 看板 — BookConv</title>
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --border: #334155;
            --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8;
            --green: #22c55e; --yellow: #eab308; --red: #ef4444;
            --purple: #a855f7; --cyan: #06b6d4;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .header { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border-bottom: 1px solid var(--border); padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.5rem; font-weight: 700; }
        .header h1 span { color: var(--accent); }
        .header-actions { display: flex; gap: 0.75rem; align-items: center; }
        .refresh-btn { background: var(--accent); color: #000; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.875rem; transition: all 0.2s; }
        .refresh-btn:hover { opacity: 0.85; transform: translateY(-1px); }
        .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .auto-refresh { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; color: var(--muted); }
        .auto-refresh input { accent-color: var(--accent); }
        .container { max-width: 1400px; margin: 0 auto; padding: 1.5rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem; transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-2px); }
        .stat-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 0.5rem; }
        .stat-value { font-size: 2rem; font-weight: 700; }
        .stat-value.green { color: var(--green); }
        .stat-value.yellow { color: var(--yellow); }
        .stat-value.red { color: var(--red); }
        .stat-value.cyan { color: var(--cyan); }
        .stat-value.purple { color: var(--purple); }
        .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
        @media (max-width: 900px) { .grid-2col { grid-template-columns: 1fr; } }
        .panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
        .panel-header { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .panel-title { font-size: 1rem; font-weight: 600; }
        .panel-body { padding: 1rem 1.25rem; max-height: 500px; overflow-y: auto; }
        .agent-card { display: flex; align-items: center; gap: 1rem; padding: 0.75rem; border-radius: 8px; margin-bottom: 0.5rem; background: rgba(255,255,255,0.02); border: 1px solid transparent; transition: all 0.2s; }
        .agent-card:hover { background: rgba(255,255,255,0.05); border-color: var(--border); }
        .agent-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .agent-dot.idle { background: var(--muted); }
        .agent-dot.working { background: var(--green); animation: pulse 2s infinite; }
        .agent-dot.error { background: var(--red); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .agent-name { font-weight: 600; font-size: 0.9rem; flex: 1; }
        .agent-status { font-size: 0.8rem; padding: 0.2rem 0.6rem; border-radius: 12px; font-weight: 500; }
        .agent-status.idle { background: rgba(148,163,184,0.15); color: var(--muted); }
        .agent-status.working { background: rgba(34,197,94,0.15); color: var(--green); }
        .agent-status.error { background: rgba(239,68,68,0.15); color: var(--red); }
        .issue-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .issue-row:last-child { border-bottom: none; }
        .issue-id { font-size: 0.75rem; font-weight: 700; color: var(--accent); min-width: 50px; }
        .issue-title { font-size: 0.85rem; flex: 1; }
        .issue-priority { font-size: 0.7rem; padding: 0.15rem 0.5rem; border-radius: 4px; font-weight: 600; }
        .issue-priority.p0 { background: rgba(239,68,68,0.2); color: var(--red); }
        .issue-priority.p1 { background: rgba(234,179,8,0.2); color: var(--yellow); }
        .issue-priority.p2 { background: rgba(56,189,248,0.2); color: var(--cyan); }
        .issue-status { font-size: 0.75rem; padding: 0.15rem 0.5rem; border-radius: 12px; }
        .issue-status.todo { background: rgba(148,163,184,0.15); color: var(--muted); }
        .issue-status.in_progress { background: rgba(168,85,247,0.15); color: var(--purple); }
        .issue-status.done { background: rgba(34,197,94,0.15); color: var(--green); }
        .phase-bar { margin-bottom: 0.75rem; }
        .phase-label { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.25rem; display: flex; justify-content: space-between; }
        .phase-track { height: 8px; background: rgba(255,255,255,0.05); border-radius: 4px; overflow: hidden; }
        .phase-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
        .daemon-info { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; font-size: 0.8rem; }
        .daemon-info dt { color: var(--muted); }
        .daemon-info dd { color: var(--text); font-weight: 500; }
        .loading { text-align: center; padding: 2rem; color: var(--muted); }
        .loading::after { content: ''; display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-left: 0.5rem; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .last-update { font-size: 0.75rem; color: var(--muted); }
        .empty-state { text-align: center; padding: 2rem; color: var(--muted); font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 <span>Multica</span> 看板 — BookConv</h1>
        <div class="header-actions">
            <div class="auto-refresh">
                <input type="checkbox" id="autoRefresh" checked>
                <label for="autoRefresh">自动刷新 (30s)</label>
            </div>
            <button class="refresh-btn" onclick="refreshAll()">⟳ 刷新</button>
            <span class="last-update" id="lastUpdate"></span>
        </div>
    </div>
    <div class="container">
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card"><div class="stat-label">Daemon 状态</div><div class="stat-value green" id="daemonStatus">加载中...</div></div>
            <div class="stat-card"><div class="stat-label">活跃任务</div><div class="stat-value cyan" id="activeTasks">-</div></div>
            <div class="stat-card"><div class="stat-label">Agent 数量</div><div class="stat-value purple" id="agentCount">-</div></div>
            <div class="stat-card"><div class="stat-label">Issues 总数</div><div class="stat-value yellow" id="totalIssues">-</div></div>
            <div class="stat-card"><div class="stat-label">已完成</div><div class="stat-value green" id="doneIssues">-</div></div>
            <div class="stat-card"><div class="stat-label">进行中</div><div class="stat-value purple" id="inProgressIssues">-</div></div>
        </div>
        <div class="grid-2col">
            <div class="panel">
                <div class="panel-header"><span class="panel-title">🤖 Agents</span></div>
                <div class="panel-body" id="agentsPanel"><div class="loading">加载 Agents</div></div>
            </div>
            <div class="panel">
                <div class="panel-header"><span class="panel-title">📋 Issues 进度</span></div>
                <div class="panel-body" id="issuesPanel"><div class="loading">加载 Issues</div></div>
            </div>
        </div>
        <div class="grid-2col">
            <div class="panel">
                <div class="panel-header"><span class="panel-title">⚙️ Daemon 信息</span></div>
                <div class="panel-body">
                    <dl class="daemon-info" id="daemonInfo">
                        <dt>版本</dt><dd id="dVersion">-</dd>
                        <dt>PID</dt><dd id="dPid">-</dd>
                        <dt>运行时间</dt><dd id="dUptime">-</dd>
                        <dt>设备</dt><dd id="dDevice">-</dd>
                        <dt>工作区</dt><dd id="dWorkspace">-</dd>
                        <dt>Runtimes</dt><dd id="dRuntimes">-</dd>
                    </dl>
                </div>
            </div>
            <div class="panel">
                <div class="panel-header"><span class="panel-title">📈 Phase 完成度</span></div>
                <div class="panel-body" id="phasesPanel">
                    <div class="empty-state">暂无 Phase 数据</div>
                </div>
            </div>
        </div>
    </div>
<script>
const PHASES = [
    { id: 1, name: "上传组件升级", issueId: "EBO-19" },
    { id: 2, name: "异步转换队列", issueId: "EBO-21" },
    { id: 3, name: "用户系统与订阅", issueId: "EBO-24" },
    { id: 4, name: "云存储集成", issueId: "EBO-25" },
    { id: 5, name: "转换引擎测试", issueId: "EBO-26" },
    { id: 6, name: "生产部署", issueId: "EBO-27" },
    { id: 7, name: "SEO Schema 完善", issueId: "EBO-28" },
    { id: 8, name: "国际化支持", issueId: "EBO-23" },
    { id: 9, name: "CI/CD 流水线", issueId: "EBO-29" },
    { id: 10, name: "博客 CMS", issueId: "EBO-30" },
    { id: 11, name: "性能优化", issueId: "EBO-22" },
    { id: 12, name: "批量转换", issueId: "EBO-31" }
];

let issueCache = [];
let daemonHealth = null;

async function fetchDaemonHealth() {
    try {
        const resp = await fetch('http://127.0.0.1:19514/health');
        daemonHealth = await resp.json();
        updateDaemonUI();
        return true;
    } catch (e) {
        document.getElementById('daemonStatus').textContent = '离线';
        document.getElementById('daemonStatus').className = 'stat-value red';
        return false;
    }
}

function updateDaemonUI() {
    if (!daemonHealth) return;
    document.getElementById('daemonStatus').textContent = '运行中';
    document.getElementById('daemonStatus').className = 'stat-value green';
    document.getElementById('activeTasks').textContent = daemonHealth.active_task_count || 0;
    document.getElementById('agentCount').textContent = daemonHealth.agents ? daemonHealth.agents.length : '-';
    document.getElementById('dVersion').textContent = daemonHealth.cli_version || '-';
    document.getElementById('dPid').textContent = daemonHealth.pid || '-';
    document.getElementById('dUptime').textContent = daemonHealth.uptime || '-';
    document.getElementById('dDevice').textContent = daemonHealth.device_name || '-';
    document.getElementById('dWorkspace').textContent = daemonHealth.workspaces ? daemonHealth.workspaces.map(w => w.id.slice(0,8)).join(', ') : '-';
    document.getElementById('dRuntimes').textContent = daemonHealth.workspaces && daemonHealth.workspaces[0] ? daemonHealth.workspaces[0].runtimes.length + ' runtimes' : '-';
}

async function fetchAgents() {
    try {
        const resp = await fetch('http://127.0.0.1:19514/agents');
        const agents = await resp.json();
        renderAgents(agents);
    } catch (e) {
        document.getElementById('agentsPanel').innerHTML = '<div class="empty-state">无法获取 Agent 数据</div>';
    }
}

function renderAgents(agents) {
    const panel = document.getElementById('agentsPanel');
    if (!agents || agents.length === 0) {
        panel.innerHTML = '<div class="empty-state">暂无 Agent</div>';
        return;
    }
    panel.innerHTML = agents.map(a => {
        const statusClass = a.status === 'working' ? 'working' : (a.status === 'error' ? 'error' : 'idle');
        const statusText = a.status === 'working' ? '工作中' : (a.status === 'error' ? '错误' : '空闲');
        return `<div class="agent-card">
            <div class="agent-dot ${statusClass}"></div>
            <span class="agent-name">${a.name || a.runtime_name || 'Unknown'}</span>
            <span class="agent-status ${statusClass}">${statusText}</span>
        </div>`;
    }).join('');
}

async function fetchIssues() {
    try {
        const resp = await fetch('http://127.0.0.1:19514/issues');
        issueCache = await resp.json();
        renderIssues(issueCache);
        renderPhases(issueCache);
    } catch (e) {
        document.getElementById('issuesPanel').innerHTML = '<div class="empty-state">无法获取 Issue 数据</div>';
    }
}

function renderIssues(issues) {
    const panel = document.getElementById('issuesPanel');
    document.getElementById('totalIssues').textContent = issues.length;
    const done = issues.filter(i => i.status === 'done').length;
    const inProg = issues.filter(i => i.status === 'in_progress').length;
    document.getElementById('doneIssues').textContent = done;
    document.getElementById('inProgressIssues').textContent = inProg;
    
    if (issues.length === 0) {
        panel.innerHTML = '<div class="empty-state">暂无 Issues</div>';
        return;
    }
    // 按优先级排序：todo > in_progress > done
    const statusOrder = { in_progress: 0, todo: 1, done: 2 };
    const sorted = [...issues].sort((a, b) => (statusOrder[a.status] || 9) - (statusOrder[b.status] || 9));
    panel.innerHTML = sorted.map(i => {
        const statusClass = i.status || 'todo';
        const statusText = statusClass === 'done' ? '已完成' : (statusClass === 'in_progress' ? '进行中' : '待处理');
        const priority = i.priority || 'medium';
        const pClass = priority === 'high' ? 'p0' : (priority === 'medium' ? 'p1' : 'p2');
        return `<div class="issue-row">
            <span class="issue-id">${i.id ? i.id.slice(0,4).toUpperCase() : '?'}</span>
            <span class="issue-title">${i.title || i.description?.slice(0, 50) || '未命名'}</span>
            <span class="issue-priority ${pClass}">${priority}</span>
            <span class="issue-status ${statusClass}">${statusText}</span>
        </div>`;
    }).join('');
}

function renderPhases(issues) {
    const panel = document.getElementById('phasesPanel');
    if (!issues || issues.length === 0) return;
    const phaseMap = {};
    issues.forEach(i => {
        const title = i.title || '';
        for (const p of PHASES) {
            if (title.includes(p.issueId) || title.includes(p.name)) {
                if (!phaseMap[p.id]) phaseMap[p.id] = { total: 0, done: 0, inProgress: 0 };
                phaseMap[p.id].total++;
                if (i.status === 'done') phaseMap[p.id].done++;
                else if (i.status === 'in_progress') phaseMap[p.id].inProgress++;
            }
        }
    });
    // 如果没找到匹配的，就显示整体进度
    if (Object.keys(phaseMap).length === 0) {
        const total = issues.length;
        const done = issues.filter(i => i.status === 'done').length;
        const pct = total > 0 ? Math.round(done / total * 100) : 0;
        panel.innerHTML = `
            <div class="phase-bar">
                <div class="phase-label"><span>总体进度</span><span>${done}/${total} (${pct}%)</span></div>
                <div class="phase-track"><div class="phase-fill" style="width:${pct}%;background:var(--green)"></div></div>
            </div>`;
        return;
    }
    let html = '';
    for (const p of PHASES) {
        const data = phaseMap[p.id];
        if (!data) continue;
        const pct = data.total > 0 ? Math.round(data.done / data.total * 100) : 0;
        const color = pct === 100 ? 'var(--green)' : (pct > 0 ? 'var(--yellow)' : 'var(--border)');
        html += `<div class="phase-bar">
            <div class="phase-label"><span>Phase ${p.id}: ${p.name}</span><span>${data.done}/${data.total} (${pct}%)</span></div>
            <div class="phase-track"><div class="phase-fill" style="width:${pct}%;background:${color}"></div></div>
        </div>`;
    }
    panel.innerHTML = html;
}

async function refreshAll() {
    const btn = document.querySelector('.refresh-btn');
    btn.disabled = true;
    btn.textContent = '⟳ 刷新中...';
    await Promise.all([fetchDaemonHealth(), fetchAgents(), fetchIssues()]);
    btn.disabled = false;
    btn.textContent = '⟳ 刷新';
    document.getElementById('lastUpdate').textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN');
}

// 初始化
refreshAll();
setInterval(() => {
    if (document.getElementById('autoRefresh').checked) refreshAll();
}, 30000);
</script>
</body>
</html>
