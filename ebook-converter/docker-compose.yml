version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - UPLOAD_DIR=/tmp/ebook-uploads
      - MAX_FILE_SIZE_MB=10
      - CALIBRE_PATH=ebook-convert
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      # 运营审计飞书推送（从 .env 读，未设则 ai-audit.js 跳过推送）
      - FEISHU_WEBHOOK=${FEISHU_WEBHOOK:-}
      # 转换后端委派密钥：Vercel 的 /api/convert 转发到本机 /api/convert-internal 时校验。
      # 须与 Vercel 的 CONVERSION_INTERNAL_SECRET 完全一致。从 VPS 上的 .env 读取。
      - CONVERSION_INTERNAL_SECRET=${CONVERSION_INTERNAL_SECRET:-}
    volumes:
      - uploads:/tmp/ebook-uploads
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  uploads:
  redis_data:
