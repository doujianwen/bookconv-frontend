name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1" # Weekly dependency scan on Mondays

env:
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ebook-converter/package-lock.json

      - name: Install dependencies
        run: cd ebook-converter && npm ci

      - name: Run ESLint
        run: cd ebook-converter && npx eslint . --max-warnings 0

      - name: TypeScript type check
        run: cd ebook-converter && npx tsc --noEmit

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ebook-converter/package-lock.json

      - name: Install dependencies
        run: cd ebook-converter && npm ci

      - name: Run Jest tests
        run: cd ebook-converter && npx jest --ci --coverage --passWithNoTests

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  build-docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (test)
        uses: docker/build-push-action@v6
        with:
          context: ./ebook-converter
          load: true
          tags: ${{ env.IMAGE_NAME }}:test-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker image starts
        run: |
          docker run -d --name test-container -p 3000:3000 ${{ env.IMAGE_NAME }}:test-latest
          sleep 10
          curl --retry 3 --fail http://localhost:3000/api/health || exit 1
          docker stop test-container && docker rm test-container

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ebook-converter/package-lock.json

      - name: Install dependencies
        run: cd ebook-converter && npm ci

      - name: Install Playwright browsers
        run: cd ebook-converter && npx playwright install --with-deps chromium

      - name: Build application
        run: cd ebook-converter && npm run build

      - name: Start server in background
        run: |
          cd ebook-converter
          npm start &
          sleep 15

      - name: Run Playwright E2E tests
        run: cd ebook-converter && npx playwright test
        continue-on-error: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: ebook-converter/playwright-report/
          retention-days: 30

  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: cd ebook-converter && npm ci

      - name: Audit dependencies
        run: cd ebook-converter && npm audit --audit-level=moderate || true

      - name: Check for outdated packages
        run: cd ebook-converter && npx npm-check-updates --dep prod,dev --peer --target patch --reject next --output
        continue-on-error: true
