<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>
  
  <rect width="700" height="480" fill="#fafafa" rx="8"/>
  
  <!-- Title -->
  <text x="350" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">常见陷阱与防御策略</text>
  
  <!-- Left column header -->
  <rect x="20" y="48" width="320" height="28" rx="6" fill="#ffebee" stroke="#f44336" stroke-width="1.5"/>
  <text x="180" y="67" text-anchor="middle" font-size="13" font-weight="bold" fill="#c62828">⚠️ 陷阱</text>
  
  <!-- Right column header -->
  <rect x="360" y="48" width="320" height="28" rx="6" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5"/>
  <text x="520" y="67" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d32">🛡️ 防御策略</text>
  
  <!-- Trap 1 -->
  <rect x="20" y="84" width="320" height="60" rx="6" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="35" y="104" font-size="12" font-weight="bold" fill="#d32f2f">陷阱1</text>
  <text x="35" y="122" font-size="11" fill="#333">UI 目视 vs CSV 导出对比</text>
  <text x="35" y="136" font-size="10" fill="#666">后果：虚假趋势判断</text>
  
  <rect x="360" y="84" width="320" height="60" rx="6" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="375" y="104" font-size="12" font-weight="bold" fill="#388e3c">防御</text>
  <text x="375" y="122" font-size="11" fill="#333">只用同格式数据对比</text>
  <text x="375" y="136" font-size="10" fill="#666">CSV vs CSV，不混用 UI 值</text>
  
  <!-- Trap 2 -->
  <rect x="20" y="152" width="320" height="60" rx="6" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="35" y="172" font-size="12" font-weight="bold" fill="#d32f2f">陷阱2</text>
  <text x="35" y="190" font-size="11" fill="#333">跨导出窗口不一致</text>
  <text x="35" y="204" font-size="10" fill="#666">后果：分母漂移，share反推失真</text>
  
  <rect x="360" y="152" width="320" height="60" rx="6" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="375" y="172" font-size="12" font-weight="bold" fill="#388e3c">防御</text>
  <text x="375" y="190" font-size="11" fill="#333">先核验 Page 求和 vs Overview</text>
  <text x="375" y="204" font-size="10" fill="#666">误差 &lt;5% 才可对比</text>
  
  <!-- Trap 3 -->
  <rect x="20" y="220" width="320" height="60" rx="6" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="35" y="240" font-size="12" font-weight="bold" fill="#d32f2f">陷阱3</text>
  <text x="35" y="258" font-size="11" fill="#333">n=3 分桶宣布"加速"</text>
  <text x="35" y="272" font-size="10" fill="#666">后果：假阳性结论</text>
  
  <rect x="360" y="220" width="320" height="60" rx="6" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="375" y="240" font-size="12" font-weight="bold" fill="#388e3c">防御</text>
  <text x="375" y="258" font-size="11" fill="#333">Wn 至少 7 天，或用十日均值</text>
  <text x="375" y="272" font-size="10" fill="#666">例：十日 26.8 / 末五日 29.2</text>
  
  <!-- Trap 4 -->
  <rect x="20" y="288" width="320" height="60" rx="6" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="35" y="308" font-size="12" font-weight="bold" fill="#d32f2f">陷阱4</text>
  <text x="35" y="326" font-size="11" fill="#333">把假设当规律</text>
  <text x="35" y="340" font-size="10" fill="#666">后果：战略误判</text>
  
  <rect x="360" y="288" width="320" height="60" rx="6" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="375" y="308" font-size="12" font-weight="bold" fill="#388e3c">防御</text>
  <text x="375" y="326" font-size="11" fill="#333">用"⚠️ 待验"标记</text>
  <text x="375" y="340" font-size="10" fill="#666">列出验证动作与时间</text>
  
  <!-- Trap 5 (right column) -->
  <rect x="360" y="356" width="320" height="60" rx="6" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="375" y="376" font-size="12" font-weight="bold" fill="#d32f2f">陷阱5（动机性推理）</text>
  <text x="375" y="394" font-size="11" fill="#333">刚被纠偏又重犯同类错误</text>
  <text x="375" y="408" font-size="10" fill="#666">后果：信用损耗</text>
  
  <rect x="20" y="356" width="320" height="60" rx="6" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="35" y="376" font-size="12" font-weight="bold" fill="#388e3c">防御</text>
  <text x="35" y="394" font-size="11" fill="#333">Layer 4 自检</text>
  <text x="35" y="408" font-size="10" fill="#666">问：我是否在用"焦虑"替代"证据"？</text>
  
  <!-- Bottom note -->
  <rect x="100" y="432" width="500" height="36" rx="6" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1"/>
  <text x="350" y="450" text-anchor="middle" font-size="11" font-weight="bold" fill="#424242">苏格拉底四层诘问框架</text>
  <text x="350" y="464" text-anchor="middle" font-size="10" fill="#666">L1: 审计判断 → L2: 审计来源 → L3: 审计数据 → L4: 审计动机</text>
</svg>