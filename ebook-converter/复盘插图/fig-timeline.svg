  <text x="200" y="300" text-anchor="middle" font-size="9" fill="#f97316" font-family="sans-serif">One page cluster</text>
  
  <rect x="260" y="250" width="110" height="55" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="315" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#c2410c" font-family="-apple-system, sans-serif">P9 Deploy Gov</text>
  <text x="315" y="287" text-anchor="middle" font-size="10" fill="#64748b" font-family="monospace">08-12~14</text>
  <text x="315" y="300" text-anchor="middle" font-size="9" fill="#f97316" font-family="sans-serif">Git sync gate</text>
  
