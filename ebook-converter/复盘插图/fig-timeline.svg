  <rect x="615" y="170" width="110" height="55" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="670" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534" font-family="-apple-system, sans-serif">P5 SEO Gates</text>
