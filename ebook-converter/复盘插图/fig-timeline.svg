  <text x="140" y="145" text-anchor="middle" font-size="11" fill="#64748b" font-family="monospace">07-15</text>
  <text x="220" y="145" text-anchor="middle" font-size="11" fill="#64748b" font-family="monospace">07-20</text>
  <text x="300" y="145" text-anchor="middle" font-size="11" fill="#16a34a" font-family="monospace" font-weight="bold">07-26</text>
  <text x="380" y="145" text-anchor="middle" font-size="11" fill="#64748b" font-family="monospace">08-01</text>
  <text x="460" y="145" text-anchor="middle" font-size="11" fill="#64748b" font-family="monospace">08-05</text>
  <text x="540" y="145" text-anchor="middle" font-size="11" fill="#64748b" font-family="monospace">08-09</text>
  <text x="620" y="145" text-anchor="middle" font-size="11" fill="#64748b" font-family="monospace">08-14</text>
  <text x="700" y="145" text-anchor="middle" font-size="11" fill="#64748b" font-family="monospace">08-15</text>
  
