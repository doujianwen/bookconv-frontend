  <text x="200" y="220" text-anchor="middle" font-size="9" fill="#94a3b8" font-family="sans-serif">Full stack</text>
  
  <rect x="260" y="170" width="110" height="55" rx="8" fill="#f0f4ff" stroke="#3b6ef5" stroke-width="1.5" filter="url(#shadow)"/>
