  <text x="642" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933" font-family="-apple-system, sans-serif">Key Milestones</text>
  
  <text x="530" y="300" font-size="11" font-weight="bold" fill="#3b82f6" font-family="sans-serif">07-09 → 07-26:</text>
  <text x="640" y="300" font-size="11" fill="#455a64" font-family="sans-serif">17 days to launch</text>
  
  <text x="530" y="320" font-size="11" font-weight="bold" fill="#3b82f6" font-family="sans-serif">07-26 → 08-15:</text>
  <text x="640" y="320" font-size="11" fill="#455a64" font-family="sans-serif">21 days post-launch iteration</text>
  
  <text x="530" y="340" font-size="11" font-weight="bold" fill="#3b82f6" font-family="sans-serif">Total commits:</text>
  <text x="640" y="340" font-size="11" fill="#455a64" font-family="sans-serif">240 (single linear main)</text>
  
  <text x="530" y="360" font-size="11" font-weight="bold" fill="#3b82f6" font-family="sans-serif">Content pages:</text>
  <text x="640" y="360" font-size="11" fill="#455a64" font-family="sans-serif">88 (36 blog + 21 guide + 30 convert + 1 compat)</text>
  
  <text x="530" y="380" font-size="11" font-weight="bold" fill="#22c55e" font-family="sans-serif">GSC growth:</text>
  <text x="640" y="380" font-size="11" fill="#455a64" font-family="sans-serif">3 → 162 keywords (+5300%)</text>
  
  <!-- Legend -->
