  <text x="85" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#3b6ef5" font-family="-apple-system, sans-serif">P0 Planning</text>
  <text x="85" y="207" text-anchor="middle" font-size="10" fill="#64748b" font-family="monospace">07-09</text>
