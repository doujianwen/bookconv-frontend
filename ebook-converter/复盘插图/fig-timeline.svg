  <text x="80" y="432" font-size="11" fill="#64748b" font-family="sans-serif">Pre-launch phase</text>
  
  <rect x="220" y="420" width="14" height="14" rx="3" fill="#22c55e"/>
  <text x="240" y="432" font-size="11" fill="#64748b" font-family="sans-serif">Post-launch phase</text>
  
  <rect x="380" y="420" width="14" height="14" rx="3" fill="#f97316"/>
  <text x="400" y="432" font-size="11" fill="#64748b" font-family="sans-serif">Major fix/refactor phase</text>
  
  <rect x="550" y="420" width="14" height="14" rx="3" fill="#dcfce7" stroke="#22c55e"/>
  <text x="570" y="432" font-size="11" fill="#64748b" font-family="sans-serif">Launch milestone</text>
