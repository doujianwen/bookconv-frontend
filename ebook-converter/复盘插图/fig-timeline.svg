  <text x="435" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#c2410c" font-family="-apple-system, sans-serif">P10 Wrap-up</text>
  <text x="435" y="287" text-anchor="middle" font-size="10" fill="#64748b" font-family="monospace">08-14~15</text>
  <text x="435" y="300" text-anchor="middle" font-size="9" fill="#f97316" font-family="sans-serif">88 pages done</text>
  
  <!-- Key stats box -->
