  <rect x="145" y="170" width="110" height="55" rx="8" fill="#f0f4ff" stroke="#3b6ef5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="200" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#3b6ef5" font-family="-apple-system, sans-serif">P1 Skeleton</text>
