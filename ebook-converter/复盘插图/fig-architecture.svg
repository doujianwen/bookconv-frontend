<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b6ef5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22a06b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2933" font-family="-apple-system, sans-serif">Single-Source Data Architecture</text>
  <text x="400" y="55" text-anchor="middle" font-size="13" fill="#64748b" font-family="-apple-system, sans-serif">Data files → index.ts registration → auto-derived lists/sitemap/RSS</text>
  
  <!-- Source layer -->
  <rect x="40" y="80" width="160" height="60" rx="8" fill="#f0f4ff" stroke="#3b6ef5" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#3b6ef5" font-family="monospace">src/data/blog/*.ts</text>
  <text x="120" y="123" text-anchor="middle" font-size="11" fill="#64748b" font-family="sans-serif">36 posts</text>
  
  <rect x="220" y="80" width="160" height="60" rx="8" fill="#f0f4ff" stroke="#3b6ef5" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#3b6ef5" font-family="monospace">src/data/guides/*.ts</text>
  <text x="300" y="123" text-anchor="middle" font-size="11" fill="#64748b" font-family="sans-serif">21 guides</text>
  
  <rect x="400" y="80" width="160" height="60" rx="8" fill="#f0f4ff" stroke="#3b6ef5" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#3b6ef5" font-family="monospace">src/data/content/*.ts</text>
  <text x="480" y="123" text-anchor="middle" font-size="11" fill="#64748b" font-family="sans-serif">30 convert pages</text>
  
  <rect x="580" y="80" width="180" height="60" rx="8" fill="#f0f4ff" stroke="#3b6ef5" stroke-width="2" filter="url(#shadow)"/>
  <text x="670" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#3b6ef5" font-family="monospace">src/data/compat/*.ts</text>
  <text x="670" y="123" text-anchor="middle" font-size="11" fill="#64748b" font-family="sans-serif">1 compat report</text>
  
  <!-- Arrows down -->
  <path d="M120 140 L120 170" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M300 140 L300 170" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M480 140 L480 170" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M670 140 L670 170" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Central registry -->
  <rect x="280" y="175" width="240" height="70" rx="10" fill="url(#grad1)" filter="url(#shadow)"/>
  <text x="400" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="white" font-family="-apple-system, sans-serif">index.ts Registry</text>
  <text x="400" y="218" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)" font-family="monospace">单一真值表 / Single source of truth</text>
  <text x="400" y="235" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.7)" font-family="monospace">CONVERSION_MAP | CONTENT_MAP</text>
  
  <!-- Derived outputs -->
  <rect x="40" y="280" width="150" height="50" rx="8" fill="#fef9c3" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="115" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e" font-family="-apple-system, sans-serif">/blog + /guide</text>
  <text x="115" y="322" text-anchor="middle" font-size="10" fill="#92400e" font-family="sans-serif">Auto-list pages</text>
  
  <rect x="210" y="280" width="150" height="50" rx="8" fill="#fef9c3" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="285" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e" font-family="-apple-system, sans-serif">/convert</text>
  <text x="285" y="322" text-anchor="middle" font-size="10" fill="#92400e" font-family="sans-serif">30 conversion pages</text>
  
  <rect x="380" y="280" width="150" height="50" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
  <text x="455" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534" font-family="-apple-system, sans-serif">sitemap.ts</text>
  <text x="455" y="322" text-anchor="middle" font-size="10" fill="#166534" font-family="sans-serif">Auto-generated</text>
  
  <rect x="550" y="280" width="150" height="50" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
  <text x="625" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534" font-family="-apple-system, sans-serif">feed.xml</text>
  <text x="625" y="322" text-anchor="middle" font-size="10" fill="#166534" font-family="sans-serif">RSS feed</text>
  
  <!-- Manual -->
  <rect x="720" y="280" width="60" height="50" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <text x="750" y="305" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626" font-family="-apple-system, sans-serif">llms.txt</text>
  <text x="750" y="322" text-anchor="middle" font-size="9" fill="#dc2626" font-family="sans-serif">Manual*</text>
  
  <!-- Arrows from center to outputs -->
  <path d="M320 245 L115 280" stroke="#3b6ef5" stroke-width="1.5" stroke-dasharray="4,2"/>
  <path d="M350 245 L285 280" stroke="#3b6ef5" stroke-width="1.5" stroke-dasharray="4,2"/>
  <path d="M400 245 L455 280" stroke="#3b6ef5" stroke-width="1.5" stroke-dasharray="4,2"/>
  <path d="M450 245 L625 280" stroke="#3b6ef5" stroke-width="1.5" stroke-dasharray="4,2"/>
  
  <!-- Legend -->
  <rect x="40" y="355" width="12" height="12" rx="2" fill="#f0f4ff" stroke="#3b6ef5"/>
  <text x="58" y="365" font-size="11" fill="#64748b" font-family="sans-serif">Source data files</text>
  
  <rect x="200" y="355" width="12" height="12" rx="2" fill="url(#grad1)"/>
  <text x="218" y="365" font-size="11" fill="#64748b" font-family="sans-serif">Registry (single truth)</text>
  
  <rect x="370" y="355" width="12" height="12" rx="2" fill="#fef9c3" stroke="#f59e0b"/>
  <text x="388" y="365" font-size="11" fill="#64748b" font-family="sans-serif">Auto-derived outputs</text>
  
  <rect x="540" y="355" width="12" height="12" rx="2" fill="#dcfce7" stroke="#22c55e"/>
  <text x="558" y="365" font-size="11" fill="#64748b" font-family="sans-serif">SEO artifacts</text>
  
  <rect x="700" y="355" width="12" height="12" rx="2" fill="#fee2e2" stroke="#ef4444"/>
  <text x="718" y="365" font-size="11" fill="#64748b" font-family="sans-serif">Manual update</text>
</svg>