<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="grad-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-yellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2933" font-family="-apple-system, sans-serif">Four-Gate Quality Closure System</text>
  <text x="400" y="55" text-anchor="middle" font-size="13" fill="#64748b" font-family="-apple-system, sans-serif">Deterministic critics · No LLM required · Hard exit on CRITICAL</text>
  
  <!-- Gate 1: seo-critic -->
  <rect x="40" y="80" width="170" height="180" rx="12" fill="white" stroke="url(#grad-yellow)" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="40" y="80" width="170" height="45" rx="12" fill="url(#grad-yellow)"/>
  <rect x="40" y="105" width="170" height="20" fill="url(#grad-yellow)"/>
  <text x="125" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="white" font-family="-apple-system, sans-serif">#1 seo-critic</text>
  
  <text x="55" y="145" font-size="11" font-weight="bold" fill="#92400e" font-family="-apple-system, sans-serif">Checks:</text>
  <text x="55" y="165" font-size="11" fill="#455a64" font-family="monospace">• Blog/guide registration</text>
  <text x="55" y="182" font-size="11" fill="#455a64" font-family="monospace">• llms.txt sync</text>
  <text x="55" y="199" font-size="11" fill="#455a64" font-family="monospace">• Dead links</text>
  <text x="55" y="216" font-size="11" fill="#455a64" font-family="monospace">• EN/ES key parity</text>
  <text x="55" y="233" font-size="11" fill="#455a64" font-family="monospace">• hreflang</text>
  
  <rect x="55" y="245" width="140" height="28" rx="6" fill="#fef3c7"/>
  <text x="125" y="263" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e" font-family="sans-serif">EXIT 1 on CRITICAL</text>
  
  <!-- Gate 2: code-critic -->
  <rect x="235" y="80" width="170" height="180" rx="12" fill="white" stroke="url(#grad-red)" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="235" y="80" width="170" height="45" rx="12" fill="url(#grad-red)"/>
  <rect x="235" y="105" width="170" height="20" fill="url(#grad-red)"/>
  <text x="320" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="white" font-family="-apple-system, sans-serif">#2 code-critic</text>
  
  <text x="250" y="145" font-size="11" font-weight="bold" fill="#dc2626" font-family="-apple-system, sans-serif">Checks:</text>
  <text x="250" y="165" font-size="11" fill="#455a64" font-family="monospace">• 6+ line dup blocks</text>
  <text x="250" y="182" font-size="11" fill="#455a64" font-family="monospace">• .mdx files (forbidden)</text>
  <text x="250" y="199" font-size="11" fill="#455a64" font-family="monospace">• Stray scripts</text>
  <text x="250" y="216" font-size="11" fill="#455a64" font-family="monospace">• AI copy-paste traces</text>
  
  <rect x="250" y="245" width="140" height="28" rx="6" fill="#fee2e2"/>
  <text x="320" y="263" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626" font-family="sans-serif">EXIT 1 on CRITICAL</text>
  
  <!-- Gate 3: conversion-verifier -->
  <rect x="430" y="80" width="170" height="180" rx="12" fill="white" stroke="url(#grad-green)" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="430" y="80" width="170" height="45" rx="12" fill="url(#grad-green)"/>
  <rect x="430" y="105" width="170" height="20" fill="url(#grad-green)"/>
  <text x="515" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="white" font-family="-apple-system, sans-serif">#3 verifier</text>
  
  <text x="445" y="145" font-size="11" font-weight="bold" fill="#166534" font-family="-apple-system, sans-serif">Checks output:</text>
  <text x="445" y="165" font-size="11" fill="#455a64" font-family="monospace">• Magic numbers</text>
  <text x="445" y="182" font-size="11" fill="#455a64" font-family="monospace">• Content loss</text>
  <text x="445" y="199" font-size="11" fill="#455a64" font-family="monospace">• Garbled text</text>
  <text x="445" y="216" font-size="11" fill="#455a64" font-family="monospace">• Missing images</text>
  <text x="445" y="235" font-size="10" fill="#64748b" font-family="sans-serif">(inline during queue)</text>
  
  <rect x="445" y="245" width="140" height="28" rx="6" fill="#dcfce7"/>
  <text x="515" y="263" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534" font-family="sans-serif">VETO POWER</text>
  
  <!-- Gate 4: git-sync-check -->
  <rect x="625" y="80" width="140" height="180" rx="12" fill="white" stroke="url(#grad-blue)" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="625" y="80" width="140" height="45" rx="12" fill="url(#grad-blue)"/>
  <rect x="625" y="105" width="140" height="20" fill="url(#grad-blue)"/>
  <text x="695" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="white" font-family="-apple-system, sans-serif">#4 git-sync</text>
  
  <text x="640" y="145" font-size="11" font-weight="bold" fill="#1e40af" font-family="-apple-system, sans-serif">Checks:</text>
  <text x="640" y="165" font-size="11" fill="#455a64" font-family="monospace">• Remote main SHA</text>
  <text x="640" y="182" font-size="11" fill="#455a64" font-family="monospace">• == Local HEAD</text>
  <text x="640" y="199" font-size="11" fill="#455a64" font-family="monospace">• Git ls-remote</text>
  <text x="640" y="216" font-size="11" fill="#455a64" font-family="monospace">• No behind=0 trust</text>
  <text x="640" y="235" font-size="10" fill="#64748b" font-family="sans-serif">Born from 08-13 crisis</text>
  
  <rect x="640" y="245" width="120" height="28" rx="6" fill="#dbeafe"/>
  <text x="700" y="263" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af" font-family="sans-serif">CI MANDATORY</text>
  
  <!-- Bottom section: why it matters -->
  <rect x="40" y="290" width="725" height="195" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="315" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933" font-family="-apple-system, sans-serif">Why Four Gates?</text>
  
  <text x="60" y="345" font-size="12" font-weight="bold" fill="#3b82f6" font-family="-apple-system, sans-serif">Root cause:</text>
  <text x="140" y="345" font-size="12" fill="#455a64" font-family="sans-serif">AI generates code fast, but quality requires deterministic verification, not model self-awareness.</text>
  
  <text x="60" y="370" font-size="12" font-weight="bold" fill="#3b82f6" font-family="-apple-system, sans-serif">240 commits:</text>
  <text x="175" y="370" font-size="12" fill="#455a64" font-family="sans-serif">Significant share AI-generated. Gates catch what AI misses: dead links, duplicate blocks, wrong data shapes, deployment mismatches.</text>
  
  <text x="60" y="395" font-size="12" font-weight="bold" fill="#3b82f6" font-family="-apple-system, sans-serif">Gate #4 origin:</text>
  <text x="185" y="395" font-size="12" fill="#455a64" font-family="sans-serif">Created after 08-13 orphan branch incident. Previously: 3 gates covered content/output quality only. Added: deployment consistency gate.</text>
  
  <!-- Flow arrows -->
  <path d="M125 260 L125 280" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M320 260 L320 280" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M515 260 L515 280" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M695 260 L695 280" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>
  
  <!-- Legend at bottom -->
  <text x="60" y="455" font-size="11" fill="#64748b" font-family="sans-serif">Triggers:</text>
  <rect x="110" y="445" width="10" height="10" rx="2" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="125" y="454" font-size="11" fill="#455a64" font-family="sans-serif">#1-2 CI push</text>
  <rect x="210" y="445" width="10" height="10" rx="2" fill="#dcfce7" stroke="#22c55e"/>
  <text x="225" y="454" font-size="11" fill="#455a64" font-family="sans-serif">#3 inline during conversion</text>
  <rect x="370" y="445" width="10" height="10" rx="2" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="385" y="454" font-size="11" fill="#455a64" font-family="sans-serif">#4 post-deploy CI</text>
</svg>