<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2933" font-family="-apple-system, sans-serif">GSC Growth Trajectory (7/26 – 8/11)</text>
  <text x="400" y="50" text-anchor="middle" font-size="12" fill="#64748b" font-family="-apple-system, sans-serif">New site ranking growth: keywords +5300% in 16 days, impressions jump +605% from 8/9</text>
  
  <!-- Chart area -->
  <rect x="80" y="70" width="640" height="280" rx="8" fill="#fafafa" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Y-axis labels -->
  <text x="70" y="90" text-anchor="end" font-size="10" fill="#94a3b8" font-family="monospace">300</text>
  <text x="70" y="145" text-anchor="end" font-size="10" fill="#94a3b8" font-family="monospace">200</text>
  <text x="70" y="200" text-anchor="end" font-size="10" fill="#94a3b8" font-family="monospace">100</text>
  <text x="70" y="255" text-anchor="end" font-size="10" fill="#94a3b8" font-family="monospace">50</text>
  <text x="70" y="340" text-anchor="end" font-size="10" fill="#94a3b8" font-family="monospace">0</text>
  
  <!-- X-axis labels -->
  <text x="120" y="360" text-anchor="middle" font-size="9" fill="#94a3b8" font-family="monospace">7/26</text>
  <text x="200" y="360" text-anchor="middle" font-size="9" fill="#94a3b8" font-family="monospace">7/29</text>
  <text x="280" y="360" text-anchor="middle" font-size="9" fill="#94a3b8" font-family="monospace">8/1</text>
  <text x="360" y="360" text-anchor="middle" font-size="9" fill="#94a3b8" font-family="monospace">8/4</text>
  <text x="440" y="360" text-anchor="middle" font-size="9" fill="#94a3b8" font-family="monospace">8/7</text>
  <text x="520" y="360" text-anchor="middle" font-size="9" fill="#94a3b8" font-family="monospace">8/9</text>
  <text x="600" y="360" text-anchor="middle" font-size="9" fill="#94a3b8" font-family="monospace">8/10</text>
  <text x="680" y="360" text-anchor="middle" font-size="9" fill="#94a3b8" font-family="monospace">8/11</text>
  
  <!-- Grid lines -->
  <line x1="100" y1="90" x2="700" y2="90" stroke="#e2e8f0" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="100" y1="145" x2="700" y2="145" stroke="#e2e8f0" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="100" y1="200" x2="700" y2="200" stroke="#e2e8f0" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="100" y1="255" x2="700" y2="255" stroke="#e2e8f0" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="100" y1="340" x2="700" y2="340" stroke="#cbd5e1" stroke-width="1"/>
  
  <!-- Keywords line (blue) -->
  <polyline points="100,335 140,330 180,320 220,305 260,285 300,260 340,230 380,195 420,160 460,130 500,100 540,85 580,75 620,70 660,65 700,60" 
            fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Impression bars (green) -->
  <rect x="100" y="335" width="30" height="5" fill="#22c55e" opacity="0.6"/>
  <rect x="140" y="325" width="30" height="15" fill="#22c55e" opacity="0.6"/>
  <rect x="180" y="305" width="30" height="35" fill="#22c55e" opacity="0.6"/>
  <rect x="220" y="275" width="30" height="65" fill="#22c55e" opacity="0.6"/>
  <rect x="260" y="240" width="30" height="100" fill="#22c55e" opacity="0.6"/>
  <rect x="300" y="200" width="30" height="140" fill="#22c55e" opacity="0.6"/>
  <rect x="340" y="155" width="30" height="185" fill="#22c55e" opacity="0.6"/>
  <rect x="380" y="110" width="30" height="230" fill="#22c55e" opacity="0.6"/>
  <rect x="420" y="75" width="30" height="265" fill="#22c55e" opacity="0.6"/>
  <rect x="460" y="60" width="30" height="280" fill="#22c55e" opacity="0.6"/>
  <!-- Jump marker at 8/9 -->
  <rect x="500" y="45" width="30" height="295" fill="#22c55e" opacity="0.7"/>
  <rect x="540" y="40" width="30" height="300" fill="#22c55e" opacity="0.7"/>
  <rect x="580" y="35" width="30" height="305" fill="#22c55e" opacity="0.7"/>
  <rect x="620" y="30" width="30" height="310" fill="#22c55e" opacity="0.7"/>
  <rect x="660" y="25" width="30" height="315" fill="#22c55e" opacity="0.7"/>
  <rect x="700" y="20" width="30" height="320" fill="#22c55e" opacity="0.7"/>
  
  <!-- Annotation: 8/9 jump -->
  <line x1="515" y1="50" x2="515" y2="35" stroke="#f97316" stroke-width="1.5" stroke-dasharray="3,3"/>
  <rect x="470" y="15" width="90" height="20" rx="4" fill="#fff7ed" stroke="#f97316"/>
  <text x="515" y="29" text-anchor="middle" font-size="10" font-weight="bold" fill="#c2410c" font-family="sans-serif">8/9 JUMP</text>
  
  <!-- Annotation: 0 clicks -->
  <rect x="600" y="400" width="160" height="40" rx="6" fill="#fee2e2" stroke="#ef4444"/>
  <text x="680" y="418" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626" font-family="sans-serif">⚠ 0 CLICKS / CTR 0%</text>
  <text x="680" y="432" text-anchor="middle" font-size="9" fill="#dc2626" font-family="sans-serif">Ranking ready, CTR bottleneck</text>
  
  <!-- Legend -->
  <rect x="100" y="395" width="12" height="12" rx="2" fill="#3b82f6"/>
  <text x="118" y="405" font-size="11" fill="#64748b" font-family="sans-serif">Ranked keywords (line)</text>
  
  <rect x="280" y="395" width="12" height="12" rx="2" fill="#22c55e"/>
  <text x="298" y="405" font-size="11" fill="#64748b" font-family="sans-serif">Daily impressions (bars)</text>
  
  <rect x="480" y="395" width="12" height="12" rx="2" fill="#f97316"/>
  <text x="498" y="405" font-size="11" fill="#64748b" font-family="sans-serif">8/9 strategy shift</text>
  
  <!-- Stats summary -->
  <rect x="580" y="390" width="190" height="50" rx="8" fill="white" stroke="#e2e8f0"/>
  <text x="675" y="408" text-anchor="middle" font-size="10" font-weight="bold" fill="#1f2933" font-family="sans-serif">16-DAY METRICS</text>
  <text x="675" y="425" text-anchor="middle" font-size="10" fill="#64748b" font-family="monospace">Keywords: 3 → 162</text>
  <text x="675" y="438" text-anchor="middle" font-size="10" fill="#64748b" font-family="monospace">Impressions: 18.8 → 132/d</text>
  
  <!-- Y-axis label -->
  <text x="30" y="210" text-anchor="middle" font-size="11" fill="#94a3b8" font-family="sans-serif" transform="rotate(-90, 30, 210)">Value</text>
  
  <!-- X-axis label -->
  <text x="400" y="385" text-anchor="middle" font-size="11" fill="#94a3b8" font-family="sans-serif">Date</text>
</svg>