# 每周纠错审查

on:
  schedule:
    # 每周日晚上 9:30 (UTC+8)
    - cron: '30 13 * * 0'  # UTC 13:30 = Beijing 21:30
  workflow_dispatch:  # 支持手动触发

jobs:
  weekly-audit:
    name: 每周纠错审查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ebook-converter

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ebook-converter/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: 轻量纠错审查
        # 2026-10-04 修正三处：
        #  1) 路径 `../../scripts/audit.sh` 越界到仓库外 ⇒ 改为仓库根内的 `../scripts/audit.sh`
        #     （working-directory 是 ./ebook-converter，`../../` 退到 $GITHUB_WORKSPACE 上一级，不存在）
        #  2) `| tee` 吞掉脚本退出码 ⇒ 审查失败时 workflow 仍报绿（假门禁）。
        #     改用 PIPESTATUS 显式取 audit.sh 的退出码。
        #  3) tsc/eslint 不在此重复跑（audit.sh 第 1、2 项已包含），交给 audit.sh 统一输出。
        run: |
          set -o pipefail
          bash ../scripts/audit.sh 2>&1 | tee audit.log
          exit "${PIPESTATUS[0]}"

      - name: 构建飞书卡片
        if: always()
        id: card
        run: |
          PASS=$(grep -c "✅" audit.log 2>/dev/null || echo 0)
          FAIL=$(grep -c "❌" audit.log 2>/dev/null || echo 0)
          WARN=$(grep -c "⚠️" audit.log 2>/dev/null || echo 0)
          STATUS=$(if [ "$FAIL" -eq 0 ]; then echo "pass"; else echo "fail"; fi)
          COLOR=$(if [ "$FAIL" -eq 0 ]; then echo "green"; else echo "red"; fi)

          TIMESTAMP=$(date '+%Y-%m-%d %H:%M')
          RUN_URL="https://github.com/doujianwen/ebook-converter/actions/runs/${{ github.run_id }}"

          cat > feishu_payload.json << PAYLOAD
          {
            "msg_type": "interactive",
            "card": {
              "header": {
                "title": {"tag": "plain_text", "content": "📊 每周纠错审查报告"},
                "template": "${COLOR}"
              },
              "elements": [
                {
                  "tag": "div",
                  "text": {
                    "tag": "lark_md",
                    "content": "**日期:** ${TIMESTAMP}\n**分支:** main\n**状态:** $(if [ "$STATUS" = "pass" ]; then echo "✅ 通过"; else echo "❌ 失败"; fi)\n\n**通过:** ${PASS} | **失败:** ${FAIL} | **警告:** ${WARN}"
                  }
                },
                {
                  "tag": "hr"
                },
                {
                  "tag": "div",
                  "text": {
                    "tag": "lark_md",
                    "content": "> 如需 Agent 级深度审查，请在 PR 评论区评论 `/audit`\n> 查看完整日志: [GitHub Actions](https://github.com/doujianwen/ebook-converter/actions/runs/${{ github.run_id }})"
                  }
                }
              ]
            }
          }
          PAYLOAD

          echo "payload=$(cat feishu_payload.json)" >> $GITHUB_OUTPUT

      - name: 推送飞书通知
        if: always()
        env:
          # 2026-10-04 安全修复：原为硬编码飞书 webhook URL，该 token 已随本文件推送到远端
          # ⇒ 视为【已泄露】，必须在飞书后台重置该机器人并把新地址填入
          # GitHub 仓库 Settings → Secrets → Actions → New repository secret（名称 FEISHU_WEBHOOK_URL）。
          # 未配置 secret 时跳过推送（不硬失败），避免每周任务因缺 secret 而红。
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          if [ -z "$FEISHU_WEBHOOK_URL" ]; then
            echo "⚠️  未配置 secret FEISHU_WEBHOOK_URL，跳过飞书推送（审查结果仍见 GitHub Actions 日志）。"
            exit 0
          fi
          curl -s -X POST "$FEISHU_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "@feishu_payload.json" || echo "飞书推送失败"
