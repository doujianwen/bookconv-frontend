name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1" # Weekly dependency scan on Mondays

env:
  NODE_VERSION: "20"

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ebook-converter/package-lock.json

      - name: Install dependencies
        run: cd ebook-converter && npm ci

      # A parse error anywhere fails `next build`, and a failed Vercel build is
      # silent: the previous deployment keeps serving, so the site looks healthy
      # while every push is dead (measured: 14 hours, 2026-09-21). core content
      # gates only parse src/data/**; this step parses the whole tree.
      - name: TypeScript parse sweep (whole tree)
        run: cd ebook-converter && node scripts/syntax-sweep.mjs

      - name: Run ESLint
        run: cd ebook-converter && npx eslint . --max-warnings 0

      - name: TypeScript type check
        run: cd ebook-converter && npx tsc --noEmit

  seo-critic:
    name: SEO / Link / i18n Critic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run SEO critic (fails on CRITICAL findings)
        run: cd ebook-converter && node scripts/seo-critic.mjs

  code-critic:
    name: Code Critic (AI hallucination gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run code critic (fails on CRITICAL findings)
        run: cd ebook-converter && node scripts/code-critic.mjs

  plan-claims:
    name: Plan Claims Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Fails if content copy re-advertises plan benefits the pipeline does not
      # implement (file sizes above 10 MB, per-plan rate limits, priority
      # queueing). The values were removed twice, and "restored" twice by a
      # session that believed they were real. A text edit cannot stop that;
      # this job can.
      - name: Run plan claims audit (fails on false plan claims)
        run: cd ebook-converter && node scripts/audit-plan-claims.mjs

      - name: Run content integrity audit (fails on structural defects)
        run: cd ebook-converter && node scripts/audit-content-integrity.mjs

      # 2026-10-04 新增：workflow / 门禁挂载点完整性审查。
      # 起因：audit.yml 与 weekly-audit.yml 引用未入库的 scripts/audit.sh、
      # 路径写成 ../../ 越界到仓库外、weekly 还用 | tee 吞掉退出码 ——
      # 三个 bug 叠加 ⇒ 这道门禁在 CI 上从未真正生效，却一直显示「有门禁」。
      # 本审查专门防这一类「看起来有、其实跑不通」的假门禁。
      # 清单由 `git ls-files -z` 经 stdin 传入：Windows 下 Node fork git 恒 EBUSY，
      # 且非 -z 会把中文路径输出成八进制转义。拿不到清单时脚本显式 exit 2（不算通过）。
      # 注意 `git -C ..`：上一行已 cd 进 ebook-converter，不加 -C 则 ls-files 以子目录为基准，
      # 得到的相对路径不含 ebook-converter/ 前缀 ⇒ I3 全部误报未入库（假失败）。
      - name: Run workflow integrity audit (fails on fake gates)
        run: cd ebook-converter && node scripts/audit-workflow-integrity.mjs --tracked-from-stdin < <(git -C .. ls-files -z)

      # 2026-10-04 新增：执行纪律门禁。把当天三类重复错误固化成可执行判据：
      #   I1 shell 退出码逻辑必须「失败计数 ⇒ 非 0 exit」全文配对（防只看尾部就判恒绿）
      #   I2 权威源必须【唯一定义处】（防凭记忆猜路径）
      #   I3 heredoc + 反斜杠反模式（仅 .sh 可静态检测的子集，脚本内已标注盲区）
      #   I4 本门禁与其它门禁的挂载点自检（防「门禁存在 ≠ 门禁生效」）
      # 环境说明：CI 上 .git/hooks 不入库 ⇒ I4 自动降级为 UNKNOWN 并明示，不制造假红。
      - name: Run agent discipline audit (fails on fake gates / path guessing)
        run: cd ebook-converter && node scripts/audit-agent-discipline.mjs

      # 防 #0 程序化页差异化成果退化：同一 heading 被 3+ 页共用即失败，
      # 且每个内容页都必须解析出 section（解析器失灵时前者会全部通过，是假通过）。
      # 阈值取 3 而非「必须唯一」：知识型标题本就应一致，强制唯一会产大量
      # 无意义改动与噪声。合理共用的标题需登记在脚本 SHARED_OK 并写明理由。
      - name: Run heading uniqueness audit (fails on shared headings)
        run: cd ebook-converter && node scripts/audit-heading-uniqueness.mjs

      # GEO compliance: convert pages (7 mandatory elements, 0-7 graded score).
      # 31/31 PASS is the baseline (9/25 calibration). Any new page missing a
      # GEO element demotes the rating and blocks deployment.
      - name: Run GEO audit — convert pages
        run: cd ebook-converter && node scripts/geo-audit-content.mjs --no-online

      # GEO compliance: guide pages (7 mandatory elements, calibrated to the
      # guide schema: keyTakeaways + authorship + thin-content guard).
      # 21/22 PASS is the baseline; 19 thin pages are documented WARNs —
      # content depth (word count) is the active constraint, not structure.
      - name: Run GEO audit — guide pages
        run: cd ebook-converter && node scripts/geo-audit-guide.mjs --no-online

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ebook-converter/package-lock.json

      - name: Install dependencies
        run: cd ebook-converter && npm ci

      - name: Run Jest tests
        run: cd ebook-converter && npx jest --ci --coverage --passWithNoTests

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: cd ebook-converter && npm ci

      - name: Audit dependencies
        run: cd ebook-converter && npm audit --audit-level=moderate || true

      - name: Check for outdated packages
        run: cd ebook-converter && npx npm-check-updates --dep prod,dev --peer --target patch --reject next --output
        continue-on-error: true
