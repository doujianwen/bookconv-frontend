name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1" # Weekly dependency scan on Mondays

env:
  NODE_VERSION: "20"

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ebook-converter/package-lock.json

      - name: Install dependencies
        run: cd ebook-converter && npm ci

      # A parse error anywhere fails `next build`, and a failed Vercel build is
      # silent: the previous deployment keeps serving, so the site looks healthy
      # while every push is dead (measured: 14 hours, 2026-09-21). core content
      # gates only parse src/data/**; this step parses the whole tree.
      - name: TypeScript parse sweep (whole tree)
        run: cd ebook-converter && node scripts/syntax-sweep.mjs

      - name: Run ESLint
        run: cd ebook-converter && npx eslint . --max-warnings 0

      - name: TypeScript type check
        run: cd ebook-converter && npx tsc --noEmit

  seo-critic:
    name: SEO / Link / i18n Critic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run SEO critic (fails on CRITICAL findings)
        run: cd ebook-converter && node scripts/seo-critic.mjs

  code-critic:
    name: Code Critic (AI hallucination gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run code critic (fails on CRITICAL findings)
        run: cd ebook-converter && node scripts/code-critic.mjs

  plan-claims:
    name: Plan Claims Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Fails if content copy re-advertises plan benefits the pipeline does not
      # implement (file sizes above 10 MB, per-plan rate limits, priority
      # queueing). The values were removed twice, and "restored" twice by a
      # session that believed they were real. A text edit cannot stop that;
      # this job can.
      - name: Run plan claims audit (fails on false plan claims)
        run: cd ebook-converter && node scripts/audit-plan-claims.mjs

      - name: Run content integrity audit (fails on structural defects)
        run: cd ebook-converter && node scripts/audit-content-integrity.mjs

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ebook-converter/package-lock.json

      - name: Install dependencies
        run: cd ebook-converter && npm ci

      - name: Run Jest tests
        run: cd ebook-converter && npx jest --ci --coverage --passWithNoTests

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: cd ebook-converter && npm ci

      - name: Audit dependencies
        run: cd ebook-converter && npm audit --audit-level=moderate || true

      - name: Check for outdated packages
        run: cd ebook-converter && npx npm-check-updates --dep prod,dev --peer --target patch --reject next --output
        continue-on-error: true
