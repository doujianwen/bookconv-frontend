name: Ebook QA Regression Gate
on:
  pull_request:
    branches: [main]
    paths: ['ebook-converter/**', '.github/workflows/qa-reviewer.yml']
  push:
    branches: [main]
    paths: ['ebook-converter/**', '.github/workflows/qa-reviewer.yml']
jobs:
  ebook-qa-reviewer:
    name: Ebook QA Regression Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ebook-converter
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ebook-converter/package-lock.json
      - name: Install dependencies
        run: npm ci
      # The former workflow referenced a missing scripts/qa/runner.ts and
      # invalid YAML steps. Run existing executable checks; do not fabricate
      # an AI review report or treat a missing report as a successful review.
      - name: Verify source and content integrity
        run: |
          node scripts/syntax-sweep.mjs
          node scripts/audit-content-integrity.mjs
          node scripts/seo-critic.mjs
      - name: Conversion and SEO regression tests
        run: npm test -- --runInBand src/lib/epub-html.test.ts tests/unit/seo-index-remediation.test.ts tests/unit/schema.test.ts tests/unit/conversion-map.test.ts tests/unit/unsupported-conversions.test.ts src/lib/conversion-purejs-epub.test.ts tests/unit/conversion-budget-cache.test.ts
      - name: GA export date regression tests
        run: node --test scripts/lib/ga-date.test.mjs scripts/lib/gsc-observation.test.mjs scripts/lib/workbench-drawer.test.mjs
      - name: Storage retention regression test
        run: npm test -- --runInBand tests/unit/storage-retention.test.ts
      - name: Backend HTTP and filename contract
        run: node conversion-backend/test/mock-run.js
      - name: Probe archive regression tests
        run: python3 geo/test_probe_archiving.py
